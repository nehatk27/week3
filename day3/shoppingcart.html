<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="shopping-cart.css" />
  </head>
  <body>
    <h1>My Store</h1>

    <div class="store-layout">
      <div class="products-shelf">
        <h2>Products</h2>

        <div class="product-card">
          <h3>Headphones</h3>
          <p>Price: Rs.200.00</p>
          <button onclick="handleAddItem(1, 'Headphones', 200)">
            Add to Cart
          </button>
        </div>

        <div class="product-card">
          <h3>Watch</h3>
          <p>Price: Rs.500.00</p>
          <button onclick="handleAddItem(2, 'Watch', 500)">Add to Cart</button>
        </div>

        <div>
          <h3>Promo Code</h3>
          <input
            type="text"
            id="coupon-input"
            placeholder="Type 0.10 for 10% off"
          />
          <button
            onclick="
              handleApplyCoupon(document.getElementById('coupon-input').value)
            "
          >
            Apply
          </button>

          <button onclick="handleUndo()" class="undo-button">
            Undo Last Action
          </button>
        </div>
      </div>

      <div class="cart-section">
        <h2>Your Shopping Cart</h2>

        <div id="cart-items">
          <p>Your cart is empty.</p>
        </div>

        <div class="total-display">
          Total: Rs.<span id="card-total">0.00</span>
        </div>
      </div>
    </div>

    <script src="shoppingcart.js"></script>
  </body>
</html>

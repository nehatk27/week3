<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CountUp Animations</title>
    <link rel="stylesheet" href="countup.css" />
  </head>
  <body>
    <section id="stats">
      <h2>Counter Stats</h2>
      <div>
        <p>Counter1: Target = 10</p>
        <h3 class="counter" data-target="10">0</h3>
      </div>
      <div>
        <p>Counter2: Target = 200</p>
        <h3 class="counter" data-target="200">0</h3>
      </div>
      <div>
        <p>Counter3: Target = 500</p>
        <h3 class="counter" data-target="500">0</h3>
      </div>
      <div>
        <p>Counter4: Target = 10000</p>
        <h3 class="counter" data-target="10000">0</h3>
      </div>
    </section>
    <script src="countup.js"></script>
  </body>
</html>

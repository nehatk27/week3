<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Error Test Page</title>
  <style>
    #error-overlay {
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85); 
      color: #ff4d4d;
      font-family: monospace;
      padding: 50px;
      z-index: 100;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>Global Error Handlers</h1>
  <p>The error overlay will appear on top of this text if a global error triggers.</p>

  <div id="error-overlay">
    <h2>Application Error Detected</h2>
    <p id="error-text"></p>
  </div>

  <script src="error-handling.js"></script>
</body>
</html>

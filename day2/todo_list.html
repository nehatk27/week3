<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic ToDo-List</title>
  </head>
  <body>
    <div class="todo-div">
      <input
        type="text"
        name="todo"
        id="todo-input"
        placeholder="Add a new task.."
      />
      <button id="add-btn">Add Task</button>

      <ul id="todo-ul"></ul>
    </div>
    <script src="todo_list.js"></script>
  </body>
</html>
